[project]
name = "plushie-pad"
version = "0.1.0"
description = "Live Python experiment editor dogfooding the plushie SDK"
requires-python = ">=3.12"
dependencies = [
    "plushie==0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plushie_pad"]

[tool.plushie]
artifacts = ["bin"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["plushie_pad", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
